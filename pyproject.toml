[project]
name = "calibration-repro"
version = "0.1.0"
description = "Reproduction of Guo et al. 2017, On Calibration of Modern Neural Networks (CIFAR-100)"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
]
